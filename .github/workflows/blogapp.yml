name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

jobs:
  deployment_pipeline:
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install backend dependencies
        working-directory: blogilista-backend
        run: npm install

      - name: Run backend tests
        working-directory: blogilista-backend
        env:
          NODE_ENV: test
          TEST_MONGODB_URI: mongodb://localhost:27017/bloglist-test
          SECRET: test-secret
        run: npm test

      - name: Install frontend dependencies
        working-directory: bloglist-frontend
        run: npm install

      - name: Lint frontend
        working-directory: bloglist-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: bloglist-frontend
        run: npm run build

      - name: Deploy backend
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Deploy frontend
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}

  notify_success:
    needs: [deployment_pipeline]
    if: ${{ success() && github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest

    steps:
      - name: Discord success notification      
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Deployment successful!"
          description: "A new version deployed to production"


  notify_failure:
    needs: [deployment_pipeline]
    if: ${{ always() && needs.deployment_pipeline.result == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Discord error notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Build failed!"
          description: |
            The pipeline encountered an error

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}
            Workflow: ${{ github.workflow }}
            Job: ${{ github.job }}

  tag_release:
    needs: [deployment_pipeline]
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
