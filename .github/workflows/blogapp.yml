name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

jobs:
  ci_and_deploy:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - PORT: 27017

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install backend dependencies
        working-directory: blogilista-backend
        run: npm install

      - name: Run backend tests
        working-directory: blogilista-backend
        env:
          TEST_MONGODB_URI: TEST_MONGODB_URI
          SECRET: SECRET
        run: npm test

      - name: Install frontend dependencies
        working-directory: bloglist-frontend
        run: npm install

      - name: Lint frontend
        working-directory: bloglist-frontend
        run: npm run lint

      - name: Build frontend
        working-directory: bloglist-frontend
        run: npm run build

